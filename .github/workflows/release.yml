# release — em tag `v*` (ou disparo manual): valida, empacota o bundle monolítico
# (embute @hiperplano/aluy-cli-core), publica no npm e cria/atualiza o GitHub Release
# com o tarball anexado.
#
# A versão publicada é a do `packages/cli/package.json` (fonte única). O dist-tag
# do npm é derivado: prerelease (`1.0.0-rc.1`) → `rc`; estável → `latest`. Assim o
# RC não vira o `latest` (quem faz `npm i -g @hiperplano/aluy-cli` pega o estável;
# o rc vem com `@rc`).
#
# CANAL — uma decisão SÓ, no passo `versão + dist-tag` (saída `stable`), consumida
# pelo dist-tag do npm E pelo GitHub Release. ENQUANTO NÃO HÁ STABLE o rc é o release
# corrente nos DOIS lugares; quando houver um `1.0.0` publicado, o prerelease para de
# mexer no `latest` do npm e passa a sair marcado como pre-release no GitHub.
#
# Pré-requisito: secret `NPM_TOKEN` (Automation/Granular com write em `@hiperplano`).

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # criar/editar releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # histórico COMPLETO: o passo de procedência precisa comparar o commit da tag
          # com `main`, e o clone raso (depth=1) do default não tem com o que comparar.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: instalar deps (lockfile exato)
        run: npm ci

      - name: validar (lint + build [type-check via tsc -b] + testes)
        # SEM excludes: os testes de binário (headless-exit/headless-yolo-bin) estavam
        # EXCLUÍDOS SÓ AQUI, enquanto o `ci.yml` já os havia REINCORPORADO (o motivo real
        # era um 'stub-token' que reprovava no `isPat`, corrigido em F166). Mantê-los fora
        # deixava o gate de RELEASE mais FRACO que o de CI — exatamente o "known-red
        # mascarado" que o comentário do ci.yml condena. A suíte passa inteira.
        run: |
          set -euo pipefail
          npm run lint
          npm run build
          npm test -- --maxWorkers=2

      - name: versão + dist-tag
        id: ver
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/cli/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # numa tag de push, ela tem de casar com a versão do package.json
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            want="${GITHUB_REF_NAME#v}"
            if [ "$want" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME != versão do package.json ($version)"
              exit 1
            fi
          fi
          # prerelease (tem `-`) → o id antes do ponto (rc/beta/…); senão latest
          if [[ "$version" == *-* ]]; then
            t="${version#*-}"; t="${t%%.*}"
          else
            t="latest"
          fi
          echo "disttag=$t" >> "$GITHUB_OUTPUT"
          echo "::notice::publicando $version (dist-tag: $t)"
          # JÁ EXISTE UM STABLE PUBLICADO? Esta é a pergunta que decide o CANAL, e ela é
          # respondida UMA vez, aqui — o dist-tag do npm e o GitHub Release leem esta saída.
          # Antes a resposta existia só no passo do dist-tag, e o GitHub Release decidia por
          # conta própria ("tem `-` ⇒ --prerelease"). As duas políticas divergiam: o npm
          # apontava o `latest` para o rc novo enquanto o GitHub escondia esse MESMO rc do
          # badge "Latest" (achado real na rc.180, a 1ª release criada pelo workflow depois
          # do conserto do publish — o badge do repo ficou parado na rc.179).
          # A consulta roda ANTES do publish DE PROPÓSITO: publicar sob a dist-tag `rc` não
          # mexe no `latest`, então o valor é o mesmo depois, e o canal fica decidido antes
          # de qualquer efeito. O `|| true` aqui NÃO afrouxa gate nenhum — é uma CONSULTA, e
          # "pacote ainda não publicado" é estado legítimo (resposta vazia ⇒ sem stable).
          cur="$(npm view @hiperplano/aluy-cli@latest version 2>/dev/null || true)"
          if [ -n "$cur" ] && [[ "$cur" != *-* ]]; then stable=1; else stable=0; fi
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "latest_cur=$cur" >> "$GITHUB_OUTPUT"
          echo "::notice::latest atual no npm: '${cur:-<nenhum>}' (stable=$stable)"

      # PROCEDÊNCIA (achado real: 17 tags, da rc.148 à rc.175, apontam para commits que NÃO
      # estão em `main`). A tag era criada na branch do PR e o merge era SQUASH: o commit
      # tagueado morre fora do histórico, então `git checkout v1.0.0-rc.170` devolve um código
      # inalcançável por `main`, e ninguém consegue ligar a versão publicada ao histórico
      # (bisect, blame, auditoria). MEDIDO, não suposto: só a ÚLTIMA tag de cada branch tem a
      # árvore do squash (rc.151 == 053ecec, rc.175 == 294120c). As INTERMEDIÁRIAS publicaram
      # árvores que NUNCA existiram em `main` — rc.149 difere do squash em 29 arquivos, rc.166
      # em 43 — e o commit tagueado é o ÚNICO registro do que foi ao npm. Por isso a tag não
      # pode ser reapontada (apontaria para outro código) nem removida (o commit fica
      # inalcançável). Tagueie DEPOIS do merge, no commit de `main`.
      - name: tag tem de estar em main (procedência)
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          # FETCH_HEAD, e não `origin/main`: o remote-tracking só é atualizado de forma
          # OPORTUNÍSTICA num fetch de branch nomeada, e depende do refspec configurado.
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::notice::$GITHUB_REF_NAME está em main"
            exit 0
          fi
          echo "::error::$GITHUB_REF_NAME aponta para um commit FORA de main ($GITHUB_SHA)."
          echo "::error::Faça o merge primeiro e crie a tag no commit de main."
          exit 1

      - name: bundle + publish-pkg (embute o cli-core; scan de segredo)
        working-directory: packages/cli
        run: |
          set -euo pipefail
          npm run scan-bundle
          npm run make-publish-pkg

      - name: empacotar o artefato REAL (publish-pkg, sem dep interna)
        id: pack
        working-directory: packages/cli
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp -r dist-bundle "$stage/"
          # assets/ carrega o aluy-mem0-server.py (servidor do sidecar mem0). SEM esta cópia
          # o tarball sai sem o script (o `files:['assets']` aponta p/ dir ausente no stage)
          # ⇒ mem0 ✗ em toda máquina/SO. Regressão histórica — manter junto do dist-bundle.
          cp -r assets "$stage/"
          cp README.md LICENSE "$stage/"
          cp package.publish.json "$stage/package.json"
          # TRAVA: o asset TEM de estar no stage antes do pack (falha barata vs. quebrar prod).
          test -f "$stage/assets/mem0/aluy-mem0-server.py" || { echo "::error::asset mem0 ausente no stage"; exit 1; }
          ( cd "$stage" && npm pack )
          tgz="$(ls "$stage"/*.tgz)"
          cp "$tgz" "$GITHUB_WORKSPACE/"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "tgz=$(basename "$tgz")" >> "$GITHUB_OUTPUT"

      # IDEMPOTENTE (achado real na rc.119): um passo POSTERIOR falhou (403 transitório
      # do registry no dist-tag) e derrubou o job DEPOIS de o publish ter dado certo —
      # re-rodar era impossível, porque o publish batia em EPUBLISHCONFLICT e o job
      # morria antes de chegar nos passos que faltavam. Agora "esta versão já está no
      # registry" é SUCESSO, não erro: re-execução vira uma opção de verdade quando algo
      # a jusante falha. NÃO afrouxa nada — publicar de novo o MESMO número de versão é
      # justamente o no-op que queremos; qualquer outro erro do publish segue FALHANDO.
      - name: npm publish (idempotente)
        id: publish
        working-directory: ${{ steps.pack.outputs.stage }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # A captura é `&& rc=0 || rc=$?` DE PROPÓSITO (achado real, rc.166 → rc.179): o runner
        # executa este bloco com `bash -e {0}`, e o `set -uo pipefail` abaixo NÃO desliga o `-e`.
        # Com `out="$(…)"; rc=$?` o shell morria NA atribuição — sem imprimir o erro do npm e
        # sem chegar no grep — e a "idempotência" nunca rodou: toda tag cuja versão já estava no
        # registry derrubava o job e pulava o GitHub Release. Comando à esquerda de `&&`/`||`
        # não dispara o `-e`. Prova: packages/cli/tests/release-workflow-publish.test.ts.
        run: |
          set -uo pipefail
          v='${{ steps.ver.outputs.version }}'
          out="$(npm publish --access public --tag "${{ steps.ver.outputs.disttag }}" 2>&1)" && rc=0 || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          # Só engole o caso EXATO "já publicada"; qualquer outra falha propaga.
          if printf '%s' "$out" | grep -qiE 'EPUBLISHCONFLICT|cannot publish over|previously published'; then
            echo "::notice::$v já estava publicada — seguindo p/ os passos restantes (re-execução)."
            exit 0
          fi
          exit "$rc"

      - name: dist-tag 'latest' → versão nova (só enquanto não há stable)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          v='${{ steps.ver.outputs.version }}'
          # `npm i` sem tag pega o `latest`. Enquanto só há prereleases (latest atual
          # com `-` ou inexistente), aponta o latest p/ a versão recém-publicada — assim
          # o bare-install pega o rc mais novo. Quando houver um stable (latest sem `-`),
          # prereleases NÃO mexem no latest (mantém o stable).
          # "Já há stable?" foi respondido no passo `versão + dist-tag` (saída `stable`) —
          # a MESMA resposta que o GitHub Release consome. O canal é decidido num lugar só.
          cur='${{ steps.ver.outputs.latest_cur }}'
          if [ '${{ steps.ver.outputs.stable }}' != '1' ]; then
            # RETRY (achado real na rc.119): o registry devolveu 403 AQUI segundos depois
            # de o MESMO token ter publicado com sucesso — a versão recém-publicada ainda
            # não tinha propagado. Sem retry, um transitório de segundos deixa o `latest`
            # apontando p/ a versão ANTERIOR: quem instala sem tag (inclusive o install.sh
            # do site) continua recebendo a antiga, com a release "parecendo" bem-sucedida.
            ok=0
            for attempt in 1 2 3 4 5; do
              if npm dist-tag add "@hiperplano/aluy-cli@$v" latest; then ok=1; break; fi
              echo "::warning::dist-tag latest falhou (tentativa $attempt/5) — nova tentativa em $((attempt * 10))s"
              sleep "$((attempt * 10))"
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::dist-tag latest → $v FALHOU após 5 tentativas. A versão ESTÁ publicada; corrija com: npm dist-tag add @hiperplano/aluy-cli@$v latest"
              exit 1
            fi
            echo "::notice::dist-tag latest → $v (ainda sem stable)"
          else
            echo "::notice::latest mantido em $cur (já há stable; prerelease não mexe)"
          fi

      # NÃO depende do dist-tag (achado real na rc.119): o dist-tag falhou, este passo foi
      # PULADO, e a release ficou meio-publicada — pacote no npm, mas sem GitHub Release.
      # O site lê a versão DAS RELEASES, então a versão nova simplesmente não aparecia,
      # enquanto o npm dizia "publicado". Basta o PUBLISH ter dado certo: se o pacote está
      # no registry, a release tem que existir. O dist-tag é ortogonal — falhar lá ainda
      # marca o job como vermelho (o `exit 1` acima), mas não sonega mais a release.
      - name: GitHub Release (cria ou atualiza) + tarball
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="v${{ steps.ver.outputs.version }}"
          # CANAL — a mesma regra do dist-tag do npm, lida da MESMA saída (`ver.stable`).
          # O GitHub esconde pre-release do badge "Latest", da barra lateral do repo e de
          # `/releases/latest`. Marcar todo `1.0.0-rc.N` como pre-release enquanto NÃO existe
          # um stable deixava o badge preso na última release criada à mão (rc.179), enquanto
          # o npm já servia a rc.180 no `latest` — o repo dizia uma versão e o registry, outra.
          # Enquanto não há stable, o rc É o release corrente nos dois lugares. Quando houver
          # um `1.0.0`, o prerelease volta a ser pre-release aqui e a parar de mexer no npm.
          if [ '${{ steps.ver.outputs.stable }}' = '1' ] && [[ "${{ steps.ver.outputs.version }}" == *-* ]]; then
            flags=(--prerelease=true --latest=false)
          else
            flags=(--prerelease=false --latest=true)
          fi
          # Os flags são aplicados TAMBÉM quando a release já existe: sem isso, uma release
          # criada antes (à mão ou por uma política velha) ficava com o canal errado para
          # sempre — re-rodar o workflow anexava o tarball e não corrigia nada.
          if gh release view "$v" >/dev/null 2>&1; then
            gh release upload "$v" "${{ steps.pack.outputs.tgz }}" --clobber
            gh release edit "$v" "${flags[@]}"
          else
            gh release create "$v" "${{ steps.pack.outputs.tgz }}" --title "$v" "${flags[@]}" --generate-notes
          fi
